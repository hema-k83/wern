<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="description" content="Wern - A Word Learning App">

  <!-- Mobile meta -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="wern">

  <!-- Icons -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Manifest (for PWA; remove if not needed) -->
  <link rel="manifest" href="manifest.json">

  <title>wern</title>

  <!-- Theme color + background -->
  <meta name="theme-color" content="#BBDCE5">

  <!-- Preload main app JS for faster fetch -->
  <link rel="preload" href="main.dart.js" as="script">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #BBDCE5; /* matches your app background */
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      font-size: 1.2rem;
      color: #065084;
      font-weight: bold;
    }
  </style>
</head>
<body>

<!-- Minimal placeholder shown until Flutter paints -->
<div id="loading">Loading Wern…</div>

<script>
  // Remove placeholder once Flutter's first frame is ready
  window.addEventListener('flutter-first-frame', function () {
    var el = document.getElementById('loading');
    if (el) el.remove();
  });
</script>

<!-- Bootstraps Flutter web app -->
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
